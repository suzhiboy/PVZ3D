<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>植物大战僵尸 3D · 第一人称</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='10' fill='%234fae3a'/%3E%3Crect x='13' y='2' width='6' height='10' rx='3' fill='%237ed957'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="view"></canvas>
      <div id="hud"></div>
      <div id="boot">正在生长草坪……</div>
    </div>
    <script>
      // Modules cannot load from file:// (the origin is "null"), so a double
      // click on this dev entry would sit on the boot screen forever.
      if (location.protocol === 'file:' && !document.documentElement.hasAttribute('data-standalone')) {
        var boot = document.getElementById('boot');
        if (boot) {
          boot.innerHTML =
            '这是开发入口，不能直接双击打开。<br>' +
            '请双击 <b>dist/pvz3d.html</b>（单文件版），或在项目目录里运行 <code>npm run dev</code> 后访问 http://127.0.0.1:5173';
        }
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
